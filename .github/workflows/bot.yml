name: Bot okazji

on:
  schedule:
    # Co 10 minut - kompromis miedzy szybkoscia a tym, zeby przebieg zdazyl
    # sie skonczyc zanim zacznie sie kolejny.
    - cron: '*/10 * * * *'
  workflow_dispatch:

# KLUCZOWE: to nie pozwala dwoch przebiegom dzialac naraz. Jesli poprzedni
# jeszcze nie skonczyl (np. bo Vinted wolniej odpowiadal), kolejny CZEKA
# w kolejce zamiast startowac rownolegle - to naprawia duplikaty w seen.json.
concurrency:
  group: bot-okazje-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: files
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj zaleznosci i przegladarke
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Uruchom bota (jedno sprawdzenie)
        env:
          DISCORD_WEBHOOK_IPHONE: ${{ secrets.DISCORD_WEBHOOK_IPHONE }}
          DISCORD_WEBHOOK_IPAD: ${{ secrets.DISCORD_WEBHOOK_IPAD }}
          DISCORD_WEBHOOK_IMAC: ${{ secrets.DISCORD_WEBHOOK_IMAC }}
          DISCORD_WEBHOOK_MACBOOK: ${{ secrets.DISCORD_WEBHOOK_MACBOOK }}
          DISCORD_WEBHOOK_APPLEWATCH: ${{ secrets.DISCORD_WEBHOOK_APPLEWATCH }}
          DISCORD_WEBHOOK_MACMINI: ${{ secrets.DISCORD_WEBHOOK_MACMINI }}
        run: python run_once.py

      - name: Zapisz pamiec bota (zeby nie wysylal tych samych ofert drugi raz)
        run: |
          git config user.name "okazje-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --quiet --cached || git commit -m "aktualizacja pamieci bota"
          # pull --rebase na wszelki wypadek, gdyby cos innego zdazylo
          # zapisac cos do repo miedzy checkout a teraz
          git pull --rebase
          git push
